# Use when Netlify builds from Git (not drag-and-drop of /out only)
[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/knowledge/blog"
  to = "/knowledge/faq"
  status = 301

[[redirects]]
  from = "/knowledge/blog/*"
  to = "/knowledge/faq"
  status = 301

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
