server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects must not leak the internal listen port or downgrade to http.
    absolute_redirect off;

    # SEO: 301 the legacy URLs so link equity consolidates on the live pages.
    location = /products          { return 301 /services; }
    location = /sectors           { return 301 /industries; }
    location = /sectors/banking   { return 301 /industries; }
    location = /contact/locations { return 301 /contact; }
    location = /knowledge/blog    { return 301 /knowledge/faq; }

    # Crawler-facing files must not be swallowed by the SPA fallback.
    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600";
        default_type application/xml;
    }

    location / {
        # $uri.html precedes $uri/: routes like /contact have both a contact.html
        # page and a contact/ directory (for /contact/locations) that has no
        # index.html. Matching the directory first 301s to /contact/ and 403s.
        try_files $uri $uri.html $uri/ /index.html;
    }

    # A parent folder with no page of its own (e.g. /knowledge) is not a
    # forbidden path, it simply does not exist.
    error_page 403 = /404.html;

    location = /404.html {
        internal;
    }

    # Hashed build assets — safe to cache forever
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Site imagery
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Icons, logos, fonts, PDFs
    location ~* \.(png|ico|webp|svg|woff2?|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff font/woff2
               application/font-woff;
}
